name: Build and deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install markdown

      # Must come before the build: the build bakes absolute canonical URLs and
      # sitemap entries, so it needs the real base URL, not a guess.
      - uses: actions/configure-pages@v5
        id: pages

      - name: Build site
        env:
          SITE_BASE: ${{ steps.pages.outputs.base_url }}
        run: python tools/build_site.py

      - name: Check output
        run: |
          test -f _site/index.html
          test -f _site/zh/index.html
          test -f _site/sitemap.xml
          test -f _site/robots.txt
          test -f build-manifest.txt
          pages=$(wc -l < build-manifest.txt)
          echo "generated $pages pages"
          test "$pages" -ge 25
          # Every *generated* page must carry a canonical URL and the JSON-LD
          # graph, since that is the whole reason this site is built rather than
          # served as raw Markdown.
          #
          # Checked against the manifest rather than by file extension: static/
          # passthrough files can also be .html — a search engine verification
          # file, for instance — and those legitimately have neither.
          while read -r p; do
            f="_site/$p"
            test -f "$f" || { echo "missing page: $f"; exit 1; }
            grep -q 'rel="canonical"' "$f" || { echo "missing canonical: $f"; exit 1; }
            grep -q 'application/ld+json' "$f" || { echo "missing JSON-LD: $f"; exit 1; }
          done < build-manifest.txt
          echo "all $pages generated pages carry canonical + JSON-LD"
          # Not generated pages, so not in the manifest: the redirect stubs for
          # the two URLs the home page linked before the layout settled, and the
          # catch-all GitHub Pages serves for anything else. All three are in
          # search indexes or reachable from them; none may disappear silently.
          test -f _site/en/index.html
          test -f _site/zh/README.html
          test -f _site/404.html
          echo "redirect stubs and 404 page present"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Push notification of what changed, rather than waiting to be crawled.
  # Bing implements IndexNow and Bing's index is what ChatGPT's web search
  # reads. Google does not participate; its discovery stays on the sitemap.
  #
  # Runs after deploy so the URLs are already live — notifying first would
  # send the engine to a 404. Never fails the run: a missed notification is
  # not a broken deployment.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Notify IndexNow
        env:
          SITE_BASE: https://misall-software.github.io/retail-localization-reference
        run: python tools/indexnow.py
